name: Buscador Diario Oposiciones

on:
  schedule:
    - cron: '17 7 * * 1-6' # Se ejecutará a las 7:17 AM UTC (de Lunes a Sábado)
  workflow_dispatch:        # Permite ejecución manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar librerías
        run: pip install requests beautifulsoup4 python-docx

      - name: Ejecutar buscador
        run: python buscador.py

      - name: Enviar por Email (GMAIL)
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "📂 Reporte Semanal Oposiciones TIC"
          to: ${{ secrets.EMAIL_USER }}
          from: "Buscador Automático"
          body: "Se adjunta el informe de los últimos 7 días. (Ejecución automática de Lunes a Sábado)."
          attachments: "*.docx"
