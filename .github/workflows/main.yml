name: Buscador Diario Oposiciones TIC

on:
  schedule:
    - cron: '17 7 * * 1-6' # Configurado a las 7:17 AM UTC (Evita horas punta)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4 # Actualizado a la versión 4

      - name: Configurar Python
        uses: actions/setup-python@v5 # Actualizado a la versión 5
        with:
          python-version: '3.11' # Subimos a una versión de Python más rápida y moderna

      - name: Instalar librerias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-docx lxml

      - name: Ejecutar buscador TIC
        run: python buscador.py

      - name: Enviar Email (Conector moderno)
        uses: dawidd6/action-send-mail@v4 # Actualizado a la versión 4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "💻 Alerta Oposiciones TIC"
          to: ${{ secrets.EMAIL_USER }}
          from: "Buscador Oposiciones"
          body: "Se adjunta el boletín detectado en los últimos 7 días."
          attachments: "*.docx" # Asegura capturar el archivo generado por el script
