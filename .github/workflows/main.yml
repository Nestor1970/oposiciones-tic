name: Buscador Unificado (TIC + Diputacion)

on:
  schedule:
    - cron: '00 8 * * 1-6' # Se ejecuta a las 8:00 AM de Lunes a Sábado
  workflow_dispatch:      # Permite ejecución manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar librerias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-docx lxml

      - name: Ejecutar buscador unificado
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python buscador.py

      - name: Enviar Email (TIC)
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "💻 Alerta Oposiciones TIC"
          to: ${{ secrets.EMAIL_USER }}
          from: "Buscador TIC"
          body: "Se adjunta el boletín con los anuncios TIC encontrados."
          attachments: "Oposiciones_*.docx"

      - name: Enviar Email (Diputacion)
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "🏛️ Alerta Diputación Coruña"
          to: ${{ secrets.EMAIL_USER }}
          from: "Buscador Diputación"
          body: "Se adjunta el boletín con los anuncios encontrados de la Diputación de A Coruña."
          attachments: "Diputacion_Coruna_*.docx"
