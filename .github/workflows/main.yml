name: Buscador Diario Oposiciones TIC

on:
  schedule:
    - cron: '17 7 * * 1-6' # Mantenemos tu minuto mágico a las 7:17 AM UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4 # Versión optimizada

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-docx lxml

      - name: Ejecutar buscador TIC
        run: python buscador.py

      - name: Enviar Email (Última versión compatible)
        uses: dawidd6/action-send-mail@v4.1.0 # Forzamos la subversión exacta que corrige Node.js
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "💻 Alerta Oposiciones TIC"
          to: ${{ secrets.EMAIL_USER }}
          from: "Buscador Oposiciones"
          body: "Se adjunta el boletín detectado en los últimos 7 días."
          attachments: "*.docx"
