name: Buscador Diario Oposiciones TIC

on:
  schedule:
    - cron: '17 7 * * 1-6'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Parche oficial para el fallo de Node 24 del 16 de junio
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-docx lxml

      - name: Ejecutar buscador TIC
        env:
          # Aquí le pasamos la llave maestra al script de Python
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python buscador.py

      - name: Enviar Email
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "💻 Alerta Oposiciones TIC"
          to: ${{ secrets.EMAIL_USER }}
          from: "Buscador Oposiciones"
          body: "Se adjunta el boletín detectado en los últimos días."
          attachments: "*.docx"
